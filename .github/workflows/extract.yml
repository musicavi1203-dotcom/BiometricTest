name: Extract ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract ZIP if present
        run: |
          if [ -f BiometricTest.zip ]; then
            unzip -q -o BiometricTest.zip -d tmp_extract
            cp -a tmp_extract/BiometricTest/. .
            rm -rf tmp_extract BiometricTest.zip
          fi

      - name: Flatten nested folder
        run: |
          if [ -d BiometricTest ]; then
            cp -a BiometricTest/. .
            rm -rf BiometricTest
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Flatten project structure"
            git push
          fi
